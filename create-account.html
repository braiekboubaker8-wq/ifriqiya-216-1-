<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | IFRIQIYA 216</title>

    <link rel="stylesheet" href="create-account.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <a href="index.html" class="logo-link">
            <img src="logo216.png" alt="IFRIQIYA 216 Logo">
        </a>

        <a href="account.html" class="back-link">
            ← ACCOUNT
        </a>

    </header>


    <!-- MAIN -->
    <main class="register-page">

        <div class="register-container">

            <!-- LEFT SIDE -->
            <div class="register-intro">

                <p class="small-title">
                    IFRIQIYA 216
                </p>

                <h1>
                    CREATE<br>
                    YOUR<br>
                    ACCOUNT
                </h1>

                <div class="red-line"></div>

                <p class="intro-text">
                    Join IFRIQIYA 216 and discover our latest
                    collections, exclusive pieces and new drops.
                </p>

                <p class="arabic">
                      IFRIQIYA 216
                </p>

            </div>


            <!-- RIGHT SIDE -->
            <div class="register-box">

                <div class="box-header">

                    <span>01</span>

                    <h2>
                        NEW HERE?
                    </h2>

                    <p>
                        Create your IFRIQIYA 216 account.
                    </p>

                </div>


                <!-- FORM -->
                <form id="registerForm">

                    <!-- FULL NAME -->
                    <div class="input-group">

                        <label for="fullName">
                            FULL NAME
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Your full name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->
                    <div class="input-group">

                        <label for="email">
                            EMAIL
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="your@email.com"
                            required
                        >

                    </div>


                    <!-- PHONE -->
                    <div class="input-group">

                        <label for="phone">
                            PHONE NUMBER
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="+216 XX XXX XXX"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="input-group">

                        <label for="password">
                            PASSWORD
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="input-group">

                        <label for="confirmPassword">
                            CONFIRM PASSWORD
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <!-- TERMS -->
                    <div class="terms">

                        <label>

                            <input
                                type="checkbox"
                                id="terms"
                                required
                            >

                            <span>
                                I agree to the IFRIQIYA 216
                                terms and conditions.
                            </span>

                        </label>

                    </div>


                    <!-- MESSAGE -->
                    <div
                        id="message"
                        class="message">
                    </div>


                    <!-- BUTTON -->
                    <button
                        type="submit"
                        class="create-button"
                    >
                        CREATE ACCOUNT
                    </button>

                </form>


                <!-- LOGIN -->
                <div class="login-link">

                    <span>
                        ALREADY HAVE AN ACCOUNT?
                    </span>

                    <a href="account.html">
                        SIGN IN
                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 IFRIQIYA 216 — CLOTHING BRAND
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="create-account.js"></script>

</body>

</html>
