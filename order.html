<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order | IFRIQYA 216</title>

    <link rel="stylesheet" href="order.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="nav-left">

            <a href="index.html">HOME</a>

            <a href="shop.html">SHOP</a>

            <a href="about.html">ABOUT US</a>

        </div>


        <!-- LOGO -->

        <a href="index.html" class="logo">
            <img src="logo216.png" alt="IFRIQYA 216">
        </a>


        <div class="nav-right">

            <a href="search.html">SEARCH</a>

            <a href="account.html">ACCOUNT</a>

        </div>

    </header>



    <!-- ORDER PAGE -->

    <main class="order-container">

        <h1>PLACE YOUR ORDER</h1>

        <div class="line"></div>


        <div class="order-layout">


            <!-- CUSTOMER INFORMATION -->

            <section class="customer-info">

                <h2>YOUR INFORMATION</h2>

                <form id="orderForm" action="https://formsubmit.co/mohamedaouina2020@gmail.com" method="POST">

                    <input type="hidden" name="_subject" value="NEW IFRIQYA 216 ORDER">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="false">

<input
    type="hidden"
    name="_autoresponse"
    value="Thank you for your order! Your order has been confirmed. We will contact you shortly.">

                
                    <label>Full Name</label>
                    <input type="text" name="name" id="name" required>
                
                    <label>Phone Number</label>
                    <input type="tel" name="phone" id="phone" required>
                
                    <label>email</label>
                    <input type="text" name="email" id="email" required>
                
                    <label>City</label>
                    <input type="text" name="city" id="city" required>
                
                    <label>Size</label>
                    <select name="size" id="size" required>
                        <option value="">Choose size</option>
                        <option value="">XS</option>
                        <option>S</option>
                        <option>M</option>
                        <option>L</option>
                        <option>XL</option>
                        <option>XXL</option>
                    </select>
                
                    <button type="submit">PLACE ORDER</button>
                
                </form>

            </section>



            <!-- ORDER SUMMARY -->

            <section class="order-summary">

                <h2>YOUR ORDER</h2>


                <div class="product-box">

                    <div>

                        <h3 id="productName">
                            Product
                        </h3>

                        <p>
                            IFRIQYA 216
                        </p>

                    </div>


                    <strong>
                        <span id="productPrice">
                            0
                        </span>
                        TND
                    </strong>

                </div>



                <div class="summary-line">

                    <span>
                        QUANTITY
                    </span>

                    <span id="summaryQuantity">
                        1
                    </span>

                </div>



                <div class="summary-line">

                    <span>
                        SHIPPING
                    </span>

                    <span>
                        FREE
                    </span>

                </div>



                <div class="total-line">

                    <span>
                        TOTAL
                    </span>

                    <strong>
                        <span id="totalPrice">
                            0
                        </span>
                        TND
                    </strong>

                </div>


                <p class="payment">
                    PAYMENT ON DELIVERY
                </p>

            </section>

        </div>

    </main>



    <!-- FOOTER -->

    <footer>

        <img src="logo216.png" alt="IFRIQYA 216">

        <p>
            IFRIQYA 216 — TUNISIAN CLOTHING BRAND
        </p>

        <p class="copyright">
            © 2026 IFRIQYA 216. ALL RIGHTS RESERVED.
        </p>

    </footer>



    <script>
        // GET PRODUCT INFORMATION FROM URL
        const params = new URLSearchParams(window.location.search);
        const product = params.get("product") || "Product";
        const price = parseFloat(params.get("price")) || 0;
    
        // DISPLAY PRODUCT
        document.getElementById("productName").textContent = product;
        document.getElementById("productPrice").textContent = price.toFixed(2);
    
        // FIXED QUANTITY (no quantity input in this form, so it's always 1)
        const quantity = 1;
        document.getElementById("summaryQuantity").textContent = quantity;
        document.getElementById("totalPrice").textContent = (price * quantity).toFixed(2);
    
        // HANDLE FORM SUBMIT WITHOUT LEAVING THE PAGE
        const form = document.getElementById("orderForm");
    
        form.addEventListener("submit", function (event) {
            event.preventDefault(); // stop normal navigation
    
            const formData = new FormData(form);
            formData.append("product", product);
            formData.append("price", price);
            formData.append("quantity", quantity);
    
            // disable button while sending
            const btn = form.querySelector("button[type='submit']");
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = "SENDING...";
    
            fetch(form.action, {
                method: "POST",
                body: formData,
                headers: { "Accept": "application/json" }
            })
            .then(response => {
                if (response.ok) {
                    showOrderMessage("Thank you! Your order has been received. We will contact you shortly.");
                    form.reset();
                } else {
                    showOrderMessage("Something went wrong. Please try again.", true);
                }
            })
            .catch(() => {
                showOrderMessage("Network error. Please check your connection and try again.", true);
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = originalText;
            });
        });
    
        function showOrderMessage(text, isError = false) {
            let msg = document.getElementById("orderMessage");
            if (!msg) {
                msg = document.createElement("p");
                msg.id = "orderMessage";
                form.insertAdjacentElement("afterend", msg);
            }
            msg.textContent = text;
            msg.style.color = isError ? "red" : "green";
            msg.style.marginTop = "12px";
        }
    </script>

</body>
</html>
